cursor_shape block
shell_integration no-cursor
cursor_trail 1

scrollback_lines 30000

tab_bar_style powerline
tab_title_template "{index}: {tab.active_exe}"

active_tab_background  #118888
active_tab_foreground  #FFFFFF

input_delay 1
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

tab_bar_min_tabs 1

clear_all_shortcuts
#kitty_mod ctrl+a

map ctrl+a>t set_tab_title
map ctrl+a>c new_tab

map ctrl+a>n next_tab
map ctrl+a>p prev_tab

map ctrl+a>" launch --location=hsplit
map ctrl+a>\ launch --location=vsplit

map ctrl+a>k neighboring_window up
map ctrl+a>j neighboring_window down
map ctrl+a>h neighboring_window left
map ctrl+a>l neighboring_window right

map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9
map ctrl+a>0 goto_tab 10

toggle_layout grid

map ctrl+a>u open_url_with_hints

map ctrl+a>[ show_scrollback
scrollback_pager sh -c 'perl -pe "s/\e\[[0-9;:]*[ -\/]*[@-~]//g; s/\e\][^\a]*(?:\a|\e\\\\)//g; s/\e[@-Z\\\\-_]//g;" | /usr/bin/env nvim  -c "set nomodifiable" -c "set buftype=nofile" -c "set noswapfile" -c "set noundofile" -c "set nowrap" -c "normal! G" -'

map ctrl+a>r load_config_file

map ctrl+a>x close_window

map ctrl+a>z toggle_layout stack

map ctrl+a>f>p kitten hints --program - --type path
map ctrl+a>f>l kitten hints --program - --type line
map ctrl+a>f>h kitten hints --program - --type hash
map ctrl+a>f>u kitten hints --program - --type url

map ctrl+t kitten choose-files

enabled_layouts splits, grid, fat, horizontal, stack, tall, vertical

copy_on_select yes

geninclude host.py


# BEGIN_KITTY_FONTS
font_family      family=Menlo postscript_name=Menlo-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS



# Vertical tab sidebar
tab_bar_edge left
tab_bar_style powerline
tab_bar_min_tabs 1

# Sidebar width (approximately 28 characters)
tab_title_max_length 28

# Colors
active_tab_background #118888
active_tab_foreground #FFFFFF

inactive_tab_background #20252B
inactive_tab_foreground #A0A0A0

# Show activity in background tabs
tab_activity_symbol ●

