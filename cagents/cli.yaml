        path: "cli.db"
      - type: mcp
        command: docker
        args: ["run", "-e", "MCP_TRANSPORT=stdio", "--rm", "-i", "mcp/context7"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/fetch"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/duckduckgo"]
      - type: mcp
        command: /Users/pawel/go/bin/mcp-shell-script
        args:
          - /Users/pawel/dotfiles/mcp-scripts/github.yaml
          - /Users/pawel/dotfiles/mcp-scripts/git.yaml
      - type: script
        shell:
          build:
            cmd: "make binary"
            description: "Build the Docker CLI binary"
          revendor:
            cmd: ./scripts/vendor update
            description: "Revendor dependencies"
          shell:
            cmd: |
              make -f docker.Makefile build_docker_image
              docker run --rm \
                -e VERSION -e GITCOMMIT -e PLATFORM -e TESTFLAGS -e TESTDIRS -e GOOS -e GOARCH -e GOARM \
                -v "$(pwd):/go/src/github.com/docker/cli" \
                -v "docker-cli-dev-cache:/root/.cache/go-build" \
                docker-cli-dev \
                bash -c "$CMD"
            description: "Run shell command inside the dev container. If you encounter unexpected error, notify user."
            args:
              CMD:
                type: string
                description: "Command to run, can run go test for unit tests"
          test_unit:
            cmd: |
              make -f docker.Makefile test-unit TEST_FILTER="$TEST_FILTER"
            description: "Run unit tests inside dev container"
            args:
              TEST_FILTER:
                type: string
                description: "Go -test.run pattern to filter tests"
          test_e2e:
            cmd: |
              make test-e2e TEST_FILTER="$TEST_FILTER"
            description: "Run e2e tests (requires running daemon)"
            args:
              TEST_FILTER:
                type: string
                description: "Go -test.run pattern to filter tests"
          run_linter:
            cmd: "make -f docker.Makefile lint"
            description: "Run go linter"
    add_date: true
    add_environment_info: true
