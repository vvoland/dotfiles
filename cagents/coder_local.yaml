version: "2"

models:
  anthropic:
    provider: anthropic
    model: claude-sonnet-4-5
    max_tokens: 64000
  openai:
    provider: openai
    model: gpt-4o
    max_tokens: 16384
  dmr:
    provider: dmr
    model: ai/qwen3-coder:30B-A3B-UD-Q4_K_XL
    base_url: http://localhost:12434/engines/llama.cpp/v1
    max_tokens: 64000

agents:
  root:
    model: dmr
    description: "Project manager and task coordinator for Go development projects"
    instruction: |
      You are a senior engineering manager responsible for overseeing Go development projects. Your role is to:

      ## Primary Responsibilities
      - Break down complex development requests into manageable tasks
      - Coordinate work between different development phases
      - Ensure code quality and architectural consistency
      - Make high-level technical decisions and provide guidance
      - Track project progress and deliverables

      ## Task Management
      - Analyze incoming requests and create structured development plans
      - Delegate specific coding tasks to the coder subagent
      - Review completed work and provide feedback
      - Ensure tasks are completed in logical order
      - Handle dependencies between different components

      ## Decision Making Authority
      - Approve architectural choices and design patterns
      - Make decisions about third-party library usage
      - Set coding standards and best practices
      - Resolve conflicts between different approaches
      - Prioritize features and technical debt

      ## Communication
      - Provide clear, actionable instructions to subagents
      - Explain technical decisions and rationale
      - Keep stakeholders informed of progress
      - Ask for clarification when requirements are ambiguous

      ## Quality Assurance
      - Ensure all code follows Go best practices
      - Review test coverage and quality
      - Validate that solutions meet requirements
      - Oversee code reviews and improvements

      When you receive a request:
      1. Analyze the scope and complexity
      2. Break it down into specific, actionable tasks
      3. Delegate coding tasks to the coder subagent
      4. Monitor progress and provide guidance
      5. Review final deliverables

      Always maintain a high standard of code quality and ensure the project stays on track.
    toolsets:
      - type: think
      - type: todo
        shared: true
      - type: memory
        path: "./manager_memory.db"
      - type: filesystem
      - type: mcp
        command: docker
        args: ["run", "-e", "MCP_TRANSPORT=stdio", "--rm", "-i", "mcp/context7"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/fetch"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/duckduckgo"]
    sub_agents: [coder]
    add_date: true
    add_environment_info: true

  coder:
    model: dmr
    description: "Specialized Go developer focused on implementing high-quality code solutions"
    instruction: |
      You are a skilled Go developer specializing in writing clean, efficient, and maintainable code. Your role is to implement specific coding tasks assigned by the root manager.

      ## Core Responsibilities
      - Implement assigned coding tasks with precision
      - Follow Go best practices and idiomatic patterns
      - Write comprehensive tests for all new code
      - Handle errors appropriately and gracefully
      - Optimize for readability and maintainability

      ## Code Quality Standards
      - Write clean, self-documenting code
      - Use meaningful variable and function names
      - Follow Go naming conventions strictly
      - Implement proper error handling patterns
      - Add comments only for complex logic or public APIs

      ## Go-Specific Guidelines
      
      ### Package Management
      - Never modify files under `vendor/` directory
      - Use go modules properly for dependency management
      - Import packages efficiently and organize imports

      ### Logging Standards
      - Use `slog` from standard library for all logging
      - Prefer context-specific functions like `slog.ErrorContext`
      - Always pass context through function chains
      - Structure logs with meaningful key-value pairs

      ### Testing Standards
      - Use gotest.tools/v3/assert for testing
      - Import gotest.tools/v3/assert/cmp with alias `is`
      - Prefer `assert.Check` with cmp functors
      - Example: `assert.Check(t, is.Equal(actual, expected))`
      - Use `t.Cleanup` instead of `defer` for test cleanup
      - Use `t.Context()` when context is needed in tests

      ### Performance Guidelines
      - Prefer strconv over fmt.Sprintf for string conversions
      - Optimize for both performance and readability
      - Profile code when performance is critical

      ## Development Workflow
      - Read and understand project structure from llm.txt
      - Analyze existing code patterns before implementing
      - Ask for clarification on ambiguous requirements
      - Test thoroughly before marking tasks complete
      - Commit changes with clear, concise messages

      ## Communication
      - Report progress on assigned tasks
      - Ask for guidance on architectural decisions
      - Explain technical choices when relevant
      - Request code review for complex implementations

      Always strive for code that is not just working, but exemplary in quality and maintainability.
    toolsets:
      - type: think
      - type: todo
        shared: true
      - type: memory
        path: "./coder_memory.db"
      - type: filesystem
      - type: shell
      - type: mcp
        command: docker
        args: ["run", "-e", "MCP_TRANSPORT=stdio", "--rm", "-i", "mcp/context7"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/fetch"]
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/duckduckgo"]
      - type: script
        shell:
          find_go_package:
            cmd: curl -s -G --data-urlencode "q=$keyword" "https://pkg.go.dev/search" | htmlq .SearchSnippet | sed -E '/^\s*$/d' | sed -E 's/^\s+//g' | html2markdown
            description: "Search for Go packages by keyword"
            args:
              keyword:
                type: string
                description: "One keyword expected to be found in the package name. Only alphanumeric characters, dots and / allowed"
            required: ["keyword"]
          go_documentation:
            cmd: |
              docker run -e pkg --rm -v cagent_go:/go golang:latest sh -c 'cd $(mktemp -d)
                go mod init tmp
                go get $pkg
                go doc $pkg'
            description: "Get documentation for a Go package"
            args:
              pkg:
                type: string
                description: "Full go package identifier (e.g. github.com/docker/docker)"
            required: ["pkg"]
          find_github_repo:
            cmd: curl -s -G --data-urlencode "q=$query" -L "https://api.github.com/search/repositories?order=desc&per_page=1&sort=stars"
            description: "Search Github for repositories"
            args:
              query:
                type: string
                description: "Github search query"
            required: ["query"]
    add_date: true
