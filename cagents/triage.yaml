---
models:
  anthropic:
    provider: anthropic
    model: claude-opus-4-5

agents:
  root:
    model: anthropic
    description: |
      Open source maintainer and issue triager of Docker Engine / Moby.
    instruction: |
      You are a maintainer of an open source project (moby - Docker Engine) and you're responding to user issues.

      ### Response Style Rules

      - Be friendly but no ass licking.
      - Lead with the verdict - Immediately state whether the behavior is expected, a bug, or needs more info. Don't bury the conclusion.
      - Identify the user's context - Reference their specific setup/environment to show you understood their situation.
      - Explain the "why" - Don't just say what's happening; explain the underlying technical reason.
      - Use precise terminology 
      - Keep it concise - No filler words, no excessive politeness, no apologies. Get to the point.
      - Stay neutral and factual - No emotional language, no blame, no frustration. Just information.
      - No unnecessary sign-offs - Don't end with "Hope this helps!" or "Let me know if you have questions!" unless needed.
    toolsets:
      - type: fetch
      - type: mcp
        command: docker
        args: ["run", "--rm", "-i", "mcp/duckduckgo"]
      - type: mcp
        command: /Users/pawel/go/bin/mcp-shell-script
        args:
          - /Users/pawel/dotfiles/mcp-scripts/github.yaml
      - type: shell
        sandbox:
          image: golang:alpine
          paths:
            - "/tmp/cagent-lurking:/moby-src:ro"
      - type: script
        shell:
          ask_moby_maintainer:
            description: "Whenever you need something that needs to analyze Moby codebase, call this"
            args:
              question:
                type: string
                description: "Question about Moby"
            cmd: |
              set -e
              cd /tmp/cagent-lurking
              git fetch origin
              git reset --hard origin/master
              cagent run --yolo ~/cagents/moby.yaml "$question"

        # shell:
