---
shell:
  github_view_issue:
    description: "View GitHub issue (without comments and replies)"
    cmd: gh issue view "$github_issue_url" --json title,body,author,labels | yq -P
    args:
      github_issue_url:
        type: string
  github_view_issue_comments:
    description: "View GitHub issue (only comments)"
    cmd: gh issue view "$github_issue_url" --json comments | yq -P
    args:
      github_issue_url:
        type: string
  github_activity:
    description: "Show my latest Github activity"
    cmd: |
      gh api /users/vvoland/events?per_page=20 --jq '.[] |
      {
        time: .created_at,
        type: .type,
        repo: .repo.name,
        action: .payload.action // "push",
        title: (.payload.issue.title // .payload.pull_request.title // .payload.ref // ""),
        number: (.payload.issue.number // .payload.pull_request.number // null),
        review_state: .payload.review.state // null,
        comment: (.payload.comment.body // .payload.review.body // null)
        }'
  github_pr_diff:
    cmd: gh pr diff "$github_pr_url"
    description: "View Github PR diff"
    args:
      github_pr_url:
        type: string
  github_pr_view:
    cmd: gh pr view "$github_pr_url" --json title,body,files,labels,url | yq -P
    description: "View Github PR metadata"
    args:
      github_pr_url:
        type: string
  github_pr_commits:
    cmd: |
      gh pr view "$github_pr_url" --json commits --jq '.commits.[] | {oid: .oid, messageBody: .messageBody}' | jq -s | yq -P
    description: "Get commits added by Github PR"
    args:
      github_pr_url:
        type: string
  github_pr_unresolved_reviews:
    cmd: |
      gh api graphql -f query='
        query($owner:  String!, $repo: String!, $pr: Int!) {
          repository(owner: $owner, name:   $repo) {
            pullRequest(number: $pr) {
              reviewThreads(first:  100) {
                nodes {
                  isResolved
                  comments(first: 100) {
                    nodes {
                      url
                      author { login }
                      body
                      diffHunk
                    }
                  }
                }
              }
            }
          }
        }' -F owner="$owner" -F repo="$repo" -F pr="$pr_number" --jq \
              '[.data.repository.pullRequest.reviewThreads.nodes[] |
           select(.isResolved == false) |
           .comments.nodes[] | {
             url: .url,
             author: .author.login,
             body: .body,
             diff_hunk: .diffHunk
           }]' | yq -P
    description: "List unresolved PR review threads"
    args:
      owner:
        type: string
      repo:
        type: string
      pr_number:
        type: string
  github_pr_comments:
    # cmd: gh api "repos/$owner/$repo/pulls/$pr_number/comments" | yq -P
    cmd: |
      gh api "repos/$owner/$repo/pulls/$pr_number/comments" --paginate --jq \
        '[. [] | {
          url: .html_url,
          author: .user.login,
          body: .body,
          diff_hunk: .diff_hunk
        }]' | yq -P
    description: "List PR comments"
    args:
      owner:
        type: string
      repo:
        type: string
      pr_number:
        type: string
  github_repo_iusses:
    cmd: |
      echo "$gh_pr_list_args" | xargs gh pr list --repo "$owner_repo" --json "$json_fields" | yq -P
    args:
      gh_pr_list_args:
        type: string
      json_fields:
        type: string
      owner_repo:
        type: string
  github_pr_ci_failures:
    args:
      gh_pr_url:
        type: string
    cmd: |
      gh pr checks "$gh_pr_url" --json name,state,link \
        --jq '.[] | select(.state!="SUCCESS") | .link' \
        | sed -E 's#.*/actions/runs/([0-9]+)/.*#\1#' \
        | sort -u \
        | xargs -I{} gh run view {} --log-failed
