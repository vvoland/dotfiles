---
shell:
  git_commit:
    description: |
      Create a Git Commit with ONLY specified files.
      Use this to check-in atomic changes.
      Use this instead of executing git in shell tool.

      Commit message is destined for future maintainers and must follow the following rules:

      - Subject: "<component>: <reason-focused summary>"
      - Use imperative mood.
      - Explain why the change is needed, not just what changed.
      - The body should capture motivation, constraints, and impact.
      - Avoid narrating the diff line-by-line.
      - Prefer concise, reviewable messages that remain useful months later.
      - Do not use emdashes!
    cmd: |
      set -xe
      git reset HEAD '*'
      printf '%s\n' "$files" | xargs git add --
      git commit -s -S -m "$message"
    args:
      files:
        type: string
        description: "Files to add via git add (this will be argument to 'git add '"
      message:
        type: string
        description: "Full commit message"
  git_absorb:
    description: "Fixup previous commits with changes to the specified files. If the changes you made adjust a commit created in this session, prefer this rather than creating a new commit."
    cmd: |
      set -xe
      git reset HEAD '*'
      printf '%s\n' "$files" | xargs git add --
      git absorb
    args:
      files:
        type: string
        description: "Files to add via git add (this will be argument to 'git add '"
      ref:
        type: string
        description: "Commit reference to fix up, for example HEAD~1 or abc123"
  git_revert:
    description: "Revert the specified commit non-interactively. Use this instead of executing git in shell tool."
    cmd: |
      set -xe
      git revert --no-edit "$ref"
    args:
      ref:
        type: string
        description: "Commit reference to revert, for example HEAD or abc123"
