---
shell:
  git_commit:
    description: "Create a Git Commit with ONLY specified files. Use this to check-in atomic changes. Use this instead of executing git in shell tool."
    cmd: |
      set -xe
      git reset HEAD '*'
      git add $files
      git commit -s -S -m "$message"
    args:
      files:
        type: string
        description: "Files to add via git add (this will be argument to 'git add '"
      message:
        type: string
        description: |
          Commit message. Explain in high level, don't focus on implementation details.
          Use imperative language like "fix" not "fixed".
          Subject format be: "<component>: <description>"
          Example: gha/ci: Add integration test workflow
